name: Offline regression tests

on:
  push:
    branches: [master, codex/windows-audit-20261007]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Python ${{ matrix.python-version }} offline contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked test dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run storage and import regressions
        run: python -X utf8 -m unittest -v test_offline
      - name: Validate module contracts with mocked network boundaries
        run: python -X utf8 -m unittest discover -s tests-contracts -v
